name: astrbot_plugin_life_stream
display_name: 生活流 · Life Stream
short_desc: 让 Bot 按自己的日程过日子，在合适的时间主动找你说话
desc: |
  读取 `astrbot_plugin_life_scheduler` 生成的当日日程，在对应时间点用当前人格主动发一条很短的消息。

  设计目标是「像在过日子」，而不是「定时打卡」：
  - 按概率跳过时间点，不是每个都汇报；
  - 每个时间点后随机延迟 0～N 分钟；
  - 免打扰时段 + 每日上限；
  - 已触发记录持久化，重启不重复；
  - 没装 life_scheduler 时安静降级，不影响启动。

  命令：`/生活流` 查看状态，`/生活流 绑定` 绑定当前会话，`/生活流 现在` 立即生成一条试效果，
  `/生活流 重置` 清空当天记录，`/生活流 开启|关闭` 开关。
